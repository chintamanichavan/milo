<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs>
<radialGradient id="bg" cx="50%" cy="22%" r="85%"><stop offset="0" stop-color="#1b2114"/><stop offset="1" stop-color="#06070a"/></radialGradient>
<linearGradient id="lime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ff8a"/><stop offset="1" stop-color="#a9df2f"/></linearGradient>
<linearGradient id="lime2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c5f74f"/><stop offset="1" stop-color="#8fc21c"/></linearGradient>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<!-- long neck -->
<rect x="214" y="300" width="84" height="150" rx="30" fill="url(#lime2)"/>
<!-- fluffy collar at the base -->
<path fill="url(#lime)" d="M150 470 C150 420 196 396 256 396 C316 396 362 420 362 470 Z"/>
<!-- banana ears curving outward -->
<path fill="url(#lime2)" d="M206 176 C176 150 160 112 172 84 C180 66 200 70 206 90 C214 120 222 150 230 176 Z"/>
<path fill="url(#lime2)" d="M306 176 C336 150 352 112 340 84 C332 66 312 70 306 90 C298 120 290 150 282 176 Z"/>
<!-- head: taller than wide, fluffy top-knot -->
<path fill="url(#lime)" d="M186 220 C186 172 216 150 256 150 C296 150 326 172 326 220 L326 286 C326 336 296 360 256 360 C216 360 186 336 186 286 Z"/>
<circle cx="226" cy="150" r="18" fill="url(#lime)"/><circle cx="256" cy="140" r="20" fill="url(#lime)"/><circle cx="286" cy="150" r="18" fill="url(#lime)"/>
<!-- eyes, set to the sides -->
<ellipse cx="220" cy="248" rx="11" ry="15" fill="#0b0d0f"/><ellipse cx="292" cy="248" rx="11" ry="15" fill="#0b0d0f"/>
<circle cx="224" cy="242" r="3.5" fill="#f4f6ee"/><circle cx="296" cy="242" r="3.5" fill="#f4f6ee"/>
<!-- muzzle low, small, llama smile -->
<ellipse cx="256" cy="318" rx="40" ry="26" fill="url(#lime2)"/>
<path d="M246 306 L266 306 L256 316 Z" fill="#0b0d0f"/>
<path d="M238 328 C246 340 266 340 274 328" fill="none" stroke="#0b0d0f" stroke-width="8" stroke-linecap="round"/>
</svg>
