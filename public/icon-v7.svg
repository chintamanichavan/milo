<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#52dbf0"/><stop offset="1" stop-color="#22c2e8"/></linearGradient>
<linearGradient id="wool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf7f1"/><stop offset="1" stop-color="#f1e3d6"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e7da"/><stop offset="1" stop-color="#efd9c6"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa143"/><stop offset="1" stop-color="#ff7a1a"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff0fa"/><stop offset="1" stop-color="#7fd9f0"/></linearGradient>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<!-- wool mass: rounded blob with a scalloped edge -->
<path fill="url(#wool)" d="M256 74 C300 74 330 92 350 118 C392 112 426 142 426 186 C458 204 470 246 452 282 C470 318 458 360 428 380 C430 420 406 452 366 458 L146 458 C106 452 82 420 84 380 C54 360 42 318 60 282 C42 246 54 204 86 186 C86 142 120 112 162 118 C182 92 212 74 256 74 Z"/>
