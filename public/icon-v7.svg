<path fill="#f6c3ad" d="M138 176 C122 140 124 106 140 92 C150 110 152 146 152 182 Z"/>
<path fill="#f1e3d6" d="M386 190 C416 140 412 92 382 70 C360 56 336 74 336 104 C336 140 340 170 346 200 Z"/>
<path fill="#f6c3ad" d="M374 176 C390 140 388 106 372 92 C362 110 360 146 360 182 Z"/>
<!-- fringe over the brow -->
<g fill="url(#wool)"><circle cx="176" cy="150" r="34"/><circle cx="216" cy="132" r="36"/><circle cx="256" cy="124" r="38"/><circle cx="296" cy="132" r="36"/><circle cx="336" cy="150" r="34"/></g>
<!-- wool curls -->
<g fill="none" stroke="#e3cfbf" stroke-width="7" stroke-linecap="round">
<path d="M124 236 c-14 0 -16 20 0 20"/><path d="M388 236 c14 0 16 20 0 20"/><path d="M100 320 c-14 0 -16 20 0 20"/><path d="M412 320 c14 0 16 20 0 20"/>
<path d="M140 404 c-14 0 -16 20 0 20"/><path d="M372 404 c14 0 16 20 0 20"/><path d="M212 96 c-14 0 -16 20 0 20"/><path d="M300 96 c14 0 16 20 0 20"/>
</g>
<!-- face: tall rounded patch -->
<rect x="152" y="196" width="208" height="232" rx="96" fill="url(#face)"/>
<!-- happy closed eyes -->
<path d="M176 292 C192 274 218 274 234 292" fill="none" stroke="#3b2f2b" stroke-width="10" stroke-linecap="round"/>
<path d="M278 292 C294 274 320 274 336 292" fill="none" stroke="#3b2f2b" stroke-width="10" stroke-linecap="round"/>
<!-- sunglasses over the eyes, translucent -->
<g fill="url(#sun)" opacity="0.88">
<rect x="150" y="272" width="112" height="44" rx="22"/><rect x="250" y="272" width="112" height="44" rx="22"/>
<rect x="238" y="286" width="36" height="12" rx="6"/>
</g>
<path d="M160 280 C180 274 220 274 252 282" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
<!-- nose + mouth -->
<path d="M238 344 L274 344 L256 362 Z" fill="#3b2f2b"/>
<path d="M256 362 L256 378 M226 384 C240 400 256 400 256 384 C256 400 272 400 286 384" fill="none" stroke="#3b2f2b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<!-- blush -->
<circle cx="180" cy="346" r="16" fill="#ffb1a3" opacity="0.55"/><circle cx="332" cy="346" r="16" fill="#ffb1a3" opacity="0.55"/>
<!-- straw from mouth into the glass -->
<path d="M262 386 L290 412 L282 512" fill="none" stroke="#ff7a1a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<!-- glass -->
<path d="M194 424 L210 512 L318 512 L334 424 Z" fill="#e8fbff" opacity="0.55"/>
<path d="M202 452 L214 512 L314 512 L326 452 Z" fill="url(#water)"/>
<path d="M194 424 L210 512 L318 512 L334 424 Z" fill="none" stroke="#ffffff" stroke-width="6"/>
<path d="M290 412 L282 512" fill="none" stroke="#ff7a1a" stroke-width="13" stroke-linecap="round" opacity="0.55"/>
</svg>
