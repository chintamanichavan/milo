services:
  web:
    image: nginx:alpine
    container_name: c25k
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
